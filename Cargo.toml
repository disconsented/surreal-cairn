[package]
description = "An up-only, checksummed, streaming migration runner for SurrealDB"
edition = "2024"
license = "MPL-2.0"
name = "surreal-cairn"
repository = "https://github.com/disconsented/surreal-cairn"
version = "0.1.0"

[lib]
name = "surreal_cairn"
path = "src/lib.rs"

[[bin]]
name = "surreal-cairn"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:chrono", "dep:clap"]
default = ["cli"]

[dependencies]
async-stream = "0.3.6"
blake2 = "0.11"
chrono = { optional = true, version = "0.4" }
clap = { features = ["derive"], optional = true, version = "4.6" }
futures = "0.3"
snafu = "0.9"
surrealdb = { features = ["protocol-http", "protocol-ws"], version = "3.1" }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
surrealdb = { features = ["kv-mem", "kv-rocksdb"], version = "3.1" }
tempfile = "3.27.0"
tokio = { features = ["full"], version = "1.48" }
tracing-subscriber = { features = ["env-filter"], version = "0.3.19" }
